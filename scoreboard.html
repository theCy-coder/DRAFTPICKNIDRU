<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MLBB Scoreboard Overlay</title>
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/overlay-designs.css">
</head>
<body>
<div class="stage" id="stage">
    <div class="sb split" id="sb">
        <div class="team blue">
            <div class="logo" id="logo-blue"></div>
            <div class="who">
                <div class="tname fit" id="name-blue"></div>
                <div class="pips" id="pips-blue"></div>
            </div>
            <div class="score" id="score-blue"></div>
            <div class="tab" id="tab-blue"></div>
        </div>
        <div class="middle" id="middle">
            <div class="info">
                <div class="tour fit" id="tour"></div>
                <div class="series" id="series"></div>
            </div>
        </div>
        <div class="team red">
            <div class="logo" id="logo-red"></div>
            <div class="who">
                <div class="tname fit" id="name-red"></div>
                <div class="pips" id="pips-red"></div>
            </div>
            <div class="score" id="score-red"></div>
            <div class="tab" id="tab-red"></div>
        </div>
    </div>
</div>
<script src="js/store.js"></script>
<script src="js/overlay-common.js"></script>
<script src="js/scoreboard.js"></script>
</body>
</html>
