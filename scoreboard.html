<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MLBB Scoreboard Overlay</title>
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/overlay-designs.css">
</head>
<body>
<div class="stage" id="stage">
    <!-- Frame layout: solid bars over the strips a phone capture leaves above
         and below the game. The scoreboard sits on the top one; the bottom one
         takes turns through what the season knows. -->
    <div class="band top" id="band-top"></div>
    <div class="band bottom" id="band-bottom">
        <div class="bb-bg"><i></i><i></i><i></i></div>
        <div class="bb-info">
            <div class="bb-brand">
                <img id="bb-logo" alt="">
                <div class="bb-series" id="bb-series"></div>
            </div>
            <!-- one page of season info at a time; rebuilt so its entrance replays -->
            <div class="bb-page" id="bb-page"></div>
        </div>
    </div>
    <!-- each team's players down the left and right edges, as on a league broadcast -->
    <div class="sidelist blue" id="side-blue"></div>
    <div class="sidelist red" id="side-red"></div>
    <div class="sb split" id="sb">
        <div class="team blue">
            <div class="logo" id="logo-blue"></div>
            <div class="who">
                <div class="tname fit" id="name-blue"></div>
                <div class="pips" id="pips-blue"></div>
            </div>
            <div class="score" id="score-blue"></div>
            <div class="tab" id="tab-blue"></div>
            <div class="stats" id="stats-blue"></div>
        </div>
        <div class="middle" id="middle">
            <img class="mid-img" id="mid-img" alt="" hidden>
            <div class="info">
                <div class="tour fit" id="tour"></div>
                <div class="series fit" id="series"></div>
            </div>
        </div>
        <div class="team red">
            <div class="logo" id="logo-red"></div>
            <div class="who">
                <div class="tname fit" id="name-red"></div>
                <div class="pips" id="pips-red"></div>
            </div>
            <div class="score" id="score-red"></div>
            <div class="tab" id="tab-red"></div>
            <div class="stats" id="stats-red"></div>
        </div>
    </div>
    <div class="fxp" id="fxp"></div>
    <div class="evt" id="evt">
        <div class="evt-box">
            <div class="evt-icon" id="evt-icon"></div>
            <div class="evt-text">
                <div class="evt-title" id="evt-title"></div>
                <div class="evt-sub" id="evt-sub"></div>
            </div>
        </div>
    </div>
</div>
<script src="js/heroes.js"></script>
<script src="js/events.js"></script>
<script src="js/store.js"></script>
<script src="js/overlay-common.js"></script>
<script src="js/scoreboard.js"></script>
</body>
</html>
