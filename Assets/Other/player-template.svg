<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320">
  <!-- Stand-in portrait shown for any player without a photo of their own.
       Replace this file to change the template for everyone at once. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#0e121c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a94ad"/>
      <stop offset="1" stop-color="#4a5368"/>
    </linearGradient>
  </defs>
  <rect width="256" height="320" fill="url(#bg)"/>
  <path d="M0 250l256-120v190H0z" fill="#ffffff" opacity="0.04"/>
  <!-- headset band -->
  <path d="M70 128a58 58 0 0 1 116 0" fill="none" stroke="#5d6781" stroke-width="12" stroke-linecap="round"/>
  <!-- head and shoulders -->
  <circle cx="128" cy="130" r="50" fill="url(#body)"/>
  <path d="M28 320c0-66 44-108 100-108s100 42 100 108z" fill="url(#body)"/>
  <!-- headset cups and mic -->
  <rect x="60" y="112" width="20" height="44" rx="9" fill="#39415a"/>
  <rect x="176" y="112" width="20" height="44" rx="9" fill="#39415a"/>
  <path d="M70 156c0 26 20 34 44 34" fill="none" stroke="#39415a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="190" r="7" fill="#39415a"/>
</svg>
