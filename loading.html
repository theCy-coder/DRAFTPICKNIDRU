<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MLBB Loading Screen</title>
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="css/overlay-designs.css">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>
<div class="stage" id="stage">
    <!-- Shares the waiting screen's backdrop, so it follows the show design. -->
    <div class="idle load" id="load">
        <div class="idle-bg"></div>
        <div class="idle-rays"></div>
        <div class="idle-sparks" id="idle-sparks"></div>

        <!-- always on screen: blue's five picks along the top, red's along the bottom -->
        <div class="ld-strip blue" id="strip-blue"></div>
        <div class="ld-strip red" id="strip-red"></div>

        <!-- between them, one slide at a time; rebuilt each time so its entrance replays -->
        <div class="ld-slides" id="slides"></div>

        <div class="ld-bar"><i id="bar"></i></div>
    </div>
</div>
<script src="js/heroes.js"></script>
<script src="js/hero-ratings.js"></script>
<script src="js/store.js"></script>
<script src="js/overlay-common.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
